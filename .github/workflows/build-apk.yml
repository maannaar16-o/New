name: Build Android APK

on:
  push:
    branches: [main, claude/faris-nutrition-app-7c6mz7]
    paths:
      - "android/**"
      - "index.html"
      - "css/**"
      - "js/**"
      - "icons/**"
      - "manifest.webmanifest"
      - "sw.js"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare signing keystore
        env:
          KEY_PASSPHRASE: ${{ secrets.BATAL_KEY_PASSPHRASE }}
        run: |
          if [ -n "$KEY_PASSPHRASE" ]; then
            # فك تشفير المفتاح الثابت المخزن في المستودع
            if ! openssl enc -d -aes-256-cbc -pbkdf2 \
                -in android/app/batal.keystore.enc \
                -out android/app/batal.keystore \
                -pass env:KEY_PASSPHRASE 2>/dev/null; then
              echo "::error::كلمة فك التشفير في السر BATAL_KEY_PASSPHRASE غير صحيحة — تأكد من نسخها كما هي بالضبط"
              exit 1
            fi
            if ! keytool -list -keystore android/app/batal.keystore -storepass batal2026faris -alias batal > /dev/null 2>&1; then
              echo "::error::فشل التحقق من المفتاح بعد فك التشفير — راجع قيمة السر BATAL_KEY_PASSPHRASE"
              exit 1
            fi
            echo "Using decrypted repository keystore (stable signature)."
          else
            keytool -genkeypair -keystore android/app/batal.keystore -alias batal \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass batal2026faris -keypass batal2026faris \
              -dname "CN=Batal Faris App, O=Family, C=EG"
            echo "::warning::No BATAL_KEY_PASSPHRASE secret found — generated a one-off keystore. Updates over a previous install will require uninstalling first. Add the secret for a stable signature."
          fi

      - name: Build release APK
        run: gradle -p android assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk batal-faris.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: batal-faris-apk
          path: batal-faris.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create apk \
            --title "تطبيق بطل — ملف APK" \
            --notes "أحدث نسخة من تطبيق «بطل» لأندرويد. نزّل ملف batal-faris.apk وثبّته على الهاتف." \
            --target "${{ github.sha }}" 2>/dev/null || true
          gh release upload apk batal-faris.apk --clobber
