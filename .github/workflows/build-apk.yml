name: Build Android APK

on:
  push:
    branches: [main, claude/faris-nutrition-app-7c6mz7]
    paths:
      - "android/**"
      - "index.html"
      - "css/**"
      - "js/**"
      - "icons/**"
      - "manifest.webmanifest"
      - "sw.js"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.BATAL_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/batal.keystore
            echo "Using keystore from repository secret (stable signature)."
          else
            keytool -genkeypair -keystore android/app/batal.keystore -alias batal \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass batal2026faris -keypass batal2026faris \
              -dname "CN=Batal Faris App, O=Family, C=EG"
            echo "::warning::No BATAL_KEYSTORE_B64 secret found — generated a one-off keystore. Updates over a previous install will require uninstalling first. Add the secret for a stable signature."
          fi

      - name: Build release APK
        env:
          BATAL_KEYSTORE_PASS: ${{ secrets.BATAL_KEYSTORE_PASS || 'batal2026faris' }}
        run: gradle -p android assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk batal-faris.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: batal-faris-apk
          path: batal-faris.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create apk \
            --title "تطبيق بطل — ملف APK" \
            --notes "أحدث نسخة من تطبيق «بطل» لأندرويد. نزّل ملف batal-faris.apk وثبّته على الهاتف." \
            --target "${{ github.sha }}" 2>/dev/null || true
          gh release upload apk batal-faris.apk --clobber
