name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasrSaree3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to Release
        if: github.ref == 'refs/heads/claude/mobile-data-wipe-app-5mnb01'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: مسح بضغطة واحدة v1.0
          body: |
            تطبيق «مسح بضغطة واحدة».
            حمّل الملف app-debug.apk من الأسفل وثبّته على موبايلك.
          files: app/build/outputs/apk/debug/app-debug.apk
