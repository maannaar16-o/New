plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yahia.oneclear'
    compileSdk 34

    defaultConfig {
        applicationId "com.yahia.oneclear"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
